# MANIFOLD v3.0 — tutti i testi visibili qui sono in Markdown.
# Questo pannello usa l'editor di file grezzi: conservare i titoli ## delle sezioni.
media:
  - name: docs
    label: Materiali PDF e documenti
    input: public/media/docs
    output: /media/docs
    rename: safe
    extensions: [pdf, pptx, docx]
  - name: images
    label: Immagini
    input: public/media/images
    output: /media/images
    rename: safe
    extensions: [png, jpg, jpeg, webp]
  - name: travel-images
    label: Fotografie dei viaggi
    input: public/media/images/viaggi
    output: /media/images/viaggi
    rename: safe
    extensions: [png, jpg, jpeg, webp]
