# MDC_LAB v2.1 — tutti i testi visibili qui sono in Markdown.
# Questo pannello usa l'editor di file grezzi: conservare i titoli ## delle sezioni.
media:
  - name: docs
    label: Materiali PDF e documenti
    input: public/media/docs
    output: /media/docs
    rename: safe
    extensions: [pdf, pptx, docx]
  - name: images
    label: Immagini
    input: public/media/images
    output: /media/images
    rename: safe
    extensions: [png, jpg, jpeg, webp]
content:
  - name: home
    label: Homepage — presentazione
    type: file
    path: content/markdown/homepage.md
    format: raw
  - name: epigrafi
    label: Homepage — epigrafi
    type: file
    path: content/markdown/epigrafi.md
    format: raw
  - name: profilo
    label: Biografia e interessi personali
    type: file
    path: content/markdown/profilo.md
    format: raw
  - name: ricerca
    label: Ricerca — presentazione
    type: file
    path: content/markdown/ricerca.md
    format: raw
  - name: temi-ricerca
    label: Schede dei temi scientifici
    type: collection
    path: content/markdown/aree-ricerca
    format: raw
    subfolders: false
  - name: pubblicazioni
    label: Pubblicazioni — testi divulgativi
    type: collection
    path: content/markdown/publications
    format: raw
    subfolders: false
  - name: insegnamenti
    label: Insegnamenti — descrizioni
    type: collection
    path: content/markdown/courses
    format: raw
    subfolders: false
  - name: lezioni
    label: Lezioni — descrizioni
    type: collection
    path: content/markdown/lectures
    format: raw
    subfolders: false
  - name: articoli
    label: Blog — testo degli articoli
    type: collection
    path: content/markdown/posts
    format: raw
    subfolders: false
  - name: schede-articoli
    label: Blog — titoli e sintesi
    type: collection
    path: content/markdown/post-details
    format: raw
    subfolders: false
