name: Validate and publish static site
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: topological-manifolds-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Check build boundaries
        run: node scripts/security-audit.mjs
      - name: Import the author-supplied CV unchanged
        run: node scripts/import-cv.mjs
      - name: Unit tests
        run: node --test tests/*.test.mjs
      - name: Validate content and build
        run: |
          if [ "$DEPLOY_ENABLED" = "true" ] && [ "$EVENT_NAME" != "pull_request" ]; then
            node scripts/build.mjs --release
          else
            node scripts/build.mjs
          fi
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          DEPLOY_ENABLED: ${{ vars.ENABLE_DEPLOY }}
          EVENT_NAME: ${{ github.event_name }}
      - name: Verify original photographs
        run: node scripts/verify-photos.mjs
      - name: Verify links, markup and CSP hashes
        run: node scripts/check-output.mjs
      - name: Check translations, editorial mirrors and resource budgets
        run: |
          node scripts/sync-editorial.mjs --check
          node scripts/audit-release.mjs
      # Keep the OS/Python pair compatible with the pinned Playwright release.
      - name: Setup Python for browser tests
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Browser regression checks
        run: python tests/browser-revision.py
      - name: Upload site only
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.ENABLE_DEPLOY == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.ENABLE_DEPLOY == 'true'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish approved artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
